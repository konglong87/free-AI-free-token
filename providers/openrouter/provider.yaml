slug: openrouter
name: OpenRouter
verified_at: "2026-11-26"
base_url: https://openrouter.ai/api/v1
openai_compatible: supported
anthropic_endpoint: null
free:
  type: daily
  note: 免费模型带 :free 后缀，按 UTC 每日计次：每分钟 20 次；累计购买不足 10 credits 时每天 50 次，购满 10 credits 后每天 1,000 次。免费模型会变化，以官方模型接口为准
requirements:
  credit_card: unknown
  real_name: unknown
  region: unknown
  other: null
usage_notes:
  - 免费模型每分钟 20 次；累计购买不足 10 credits 时每天只有 50 次
  - 免费模型列表经常变化，原有模型可能下线
sources:
  - {label: 官网, url: "https://openrouter.ai/"}
  - {label: Quickstart, url: "https://openrouter.ai/docs/quickstart"}
  - {label: 免费模型筛选, url: "https://openrouter.ai/models?max_price=0"}
  - {label: 模型接口, url: "https://openrouter.ai/api/v1/models"}
  - {label: 限额, url: "https://openrouter.ai/docs/api-reference/limits"}
  - {label: FAQ, url: "https://openrouter.ai/docs/faq"}
home:
  order: 90
  pages: [readme, readme-b]
  tags: [文本生成]
  pending_tags: []
  status: ok
  status_note: null
  signup: {label: 注册, url: "https://openrouter.ai/"}
  extras: []
